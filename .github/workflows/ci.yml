name: ci

on:
  push:
    branches: ['1.0.x']
  pull_request:
    branches: ['1.0.x']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 24: the lowest Node.js this plugin's engines field accepts (">=24"), and the one the dashboard runs on.
        # 26: the latest LTS release, which the Workspace builds on.
        node: ['24', '26']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: every shell script parses
        run: |
          git ls-files -z '*.sh' | xargs -0 -r -n1 bash -n
          echo "$(git ls-files '*.sh' | wc -l) shell script(s) parse"

  # The plugin's webship-js features against a dashboard with this plugin installed (packed from this
  # checkout), started in the job: no DDEV, no account. The workflow lives in webship/workspace.
  browser:
    name: webship-js features
    uses: webship/workspace/.github/workflows/plugin-browser-suite.yml@1.0.x
